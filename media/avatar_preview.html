<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>LEEFH Bot - Avatar & Icon Generator</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 242, 254, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 550px;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 28px;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #00f2fe, #4facfe, #00e676);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #9ca3af;
      margin: 0 0 24px 0;
      font-size: 14px;
    }
    #icon-container {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
      margin-bottom: 24px;
      overflow: hidden;
    }
    #icon-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .btn {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #030712;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 242, 254, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(0, 242, 254, 0.6);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ LEEFH BOT ICON</h1>
    <p>Avatar Oficial para Telegram en Alta Definición (512x512)</p>
    
    <div id="icon-container">
      <svg id="leefh-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
        <defs>
          <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0e17" />
            <stop offset="50%" stop-color="#050811" />
            <stop offset="100%" stop-color="#020408" />
          </linearGradient>

          <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="50%" stop-color="#4facfe" />
            <stop offset="100%" stop-color="#00e676" />
          </linearGradient>

          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          
          <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="16" result="blur1" />
            <feGaussianBlur stdDeviation="6" result="blur2" />
            <feMerge>
              <feMergeNode in="blur1" />
              <feMergeNode in="blur2" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#00e676" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#4facfe" stop-opacity="0.9"/>
          </linearGradient>
        </defs>

        <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="6" />
        <circle cx="256" cy="256" r="226" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="14 10 30 10" opacity="0.4" />
        <circle cx="256" cy="256" r="212" fill="none" stroke="#00e676" stroke-width="1" stroke-dasharray="40 20 10 20" opacity="0.3" />

        <circle cx="120" cy="140" r="4" fill="#00f2fe" filter="url(#glow)"/>
        <circle cx="390" cy="150" r="5" fill="#00e676" filter="url(#glow)"/>
        <circle cx="380" cy="380" r="4" fill="#00f2fe" filter="url(#glow)"/>
        <circle cx="130" cy="370" r="4.5" fill="#4facfe" filter="url(#glow)"/>

        <path d="M 180 80 Q 256 120 332 80" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
        <path d="M 140 430 Q 256 470 372 430" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.3" filter="url(#glow)"/>

        <g filter="url(#intenseGlow)">
          <path d="M 230 110 
                   L 165 260 
                   L 225 260 
                   L 180 375 
                   L 335 230 
                   L 265 230 
                   L 310 110 
                   Z" 
                fill="url(#neonCyan)" 
                stroke="#ffffff" 
                stroke-width="3" 
                stroke-linejoin="round" />
        </g>

        <g filter="url(#glow)">
          <text x="256" y="425" 
                font-family="'Montserrat', 'Segoe UI', 'Roboto', sans-serif" 
                font-size="44" 
                font-weight="900" 
                letter-spacing="14" 
                fill="#ffffff" 
                text-anchor="middle">
            LEEFH
          </text>
          <text x="256" y="452" 
                font-family="'Segoe UI', 'Roboto', sans-serif" 
                font-size="12" 
                font-weight="700" 
                letter-spacing="6" 
                fill="#00f2fe" 
                text-anchor="middle" 
                opacity="0.85">
            AI MEDIA &amp; 4GB LEECH
          </text>
        </g>
      </svg>
    </div>

    <button class="btn" onclick="descargarPNG()">
      📥 Descargar Imagen PNG (1024x1024)
    </button>
  </div>

  <canvas id="export-canvas" width="1024" height="1024" style="display:none;"></canvas>

  <script>
    function descargarPNG() {
      const svgElement = document.getElementById('leefh-svg');
      const canvas = document.getElementById('export-canvas');
      const ctx = canvas.getContext('2d');
      const svgString = new XMLSerializer().serializeToString(svgElement);
      const img = new Image();
      const svgBlob = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'});
      const URL = window.URL || window.webkitURL || window;
      const blobURL = URL.createObjectURL(svgBlob);

      img.onload = function() {
        ctx.clearRect(0, 0, 1024, 1024);
        ctx.drawImage(img, 0, 0, 1024, 1024);
        const pngURL = canvas.toDataURL('image/png');
        const downloadLink = document.createElement('a');
        downloadLink.href = pngURL;
        downloadLink.download = 'LEEFH_Bot_Avatar_1024x1024.png';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        URL.revokeObjectURL(blobURL);
      };
      img.src = blobURL;
    }
  </script>
</body>
</html>
