<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00e676" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Base Circle with Border -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="6" />

  <!-- Outer Tech Circuit Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="14 10 30 10" opacity="0.4" />
  <circle cx="256" cy="256" r="212" fill="none" stroke="#00e676" stroke-width="1" stroke-dasharray="40 20 10 20" opacity="0.3" />

  <!-- Orbiting Nodes -->
  <circle cx="120" cy="140" r="4" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="390" cy="150" r="5" fill="#00e676" filter="url(#glow)"/>
  <circle cx="380" cy="380" r="4" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="130" cy="370" r="4.5" fill="#4facfe" filter="url(#glow)"/>

  <!-- Glowing Download Energy Streams (Background) -->
  <path d="M 180 80 Q 256 120 332 80" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
  <path d="M 140 430 Q 256 470 372 430" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.3" filter="url(#glow)"/>

  <!-- High-Speed Lightning / Leech Vortex Icon (Center) -->
  <g filter="url(#intenseGlow)">
    <!-- Stylized Futuristic 'L' + Lightning Bolt -->
    <path d="M 230 110 
             L 165 260 
             L 225 260 
             L 180 375 
             L 335 230 
             L 265 230 
             L 310 110 
             Z" 
          fill="url(#neonCyan)" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linejoin="round" />
  </g>

  <!-- Foreground High-Tech Text: LEEFH -->
  <g filter="url(#glow)">
    <text x="256" y="425" 
          font-family="'Montserrat', 'Segoe UI', 'Roboto', sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="14" 
          fill="#ffffff" 
          text-anchor="middle">
      LEEFH
    </text>
    <text x="256" y="452" 
          font-family="'Segoe UI', 'Roboto', sans-serif" 
          font-size="12" 
          font-weight="700" 
          letter-spacing="6" 
          fill="#00f2fe" 
          text-anchor="middle" 
          opacity="0.85">
      AI MEDIA &amp; 4GB LEECH
    </text>
  </g>
</svg>
